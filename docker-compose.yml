version: "3.9"

services:
  # --- Zookeeper (Kafka dependency) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: bs-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "*"
    ports:
      - "2181:2181"
    healthcheck:
      test: echo srvr | nc localhost 2181 | grep -q "Zookeeper version"
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Kafka Broker ---
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: bs-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "5"
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list
      interval: 15s
      timeout: 10s
      retries: 10

  # --- Confluent Schema Registry ---
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    container_name: bs-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: curl -f http://localhost:8081/subjects || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  # --- TimescaleDB (PostgreSQL + TimescaleDB extension) ---
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: bs-timescaledb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER}
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Spark Master ---
  spark-master:
    image: bitnamilegacy/spark:3.5
    container_name: bs-spark-master
    ports:
      - "8080:8080"    # Spark UI
      - "7077:7077"    # Spark master port
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master

  # --- Spark Worker ---
  spark-worker:
    image: bitnamilegacy/spark:3.5
    container_name: bs-spark-worker
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2

  # --- GBFS Producer (Python) ---
  producer:
    build: ./producer
    container_name: bs-producer
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
    restart: unless-stopped

  # --- Spark Streaming Job ---
  spark-job:
    build: ./spark
    container_name: bs-spark-job
    depends_on:
      - spark-master
      - kafka
      - timescaledb
      - schema-registry
    volumes:
      - spark_checkpoints:/tmp
    environment:
      SPARK_MASTER: spark://spark-master:7077
      KAFKA_BROKER: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped

  # --- Real-Time Dashboard (Shiny) ---
  dashboard:
    build: ./dashboard
    container_name: bs-dashboard
    ports:
      - "3838:3838"
    depends_on:
      - timescaledb
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped

  # --- ML Predictor (XGBoost) ---
  ml-predictor:
    build: ./ml-predictor
    container_name: bs-ml-predictor
    depends_on:
      - timescaledb
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ml_models:/app/models
    restart: unless-stopped

volumes:
  pgdata:
  spark_checkpoints:
  ml_models:
